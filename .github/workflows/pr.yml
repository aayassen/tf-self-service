# Pull requests: check the rules, plan the affected teams, post one comment.
# Nothing is applied here. Plans are skipped until AWS accounts are configured.
name: pr
on:
  pull_request:
  pull_request_review:
    types: [submitted] # re-check when the platform team approves

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.changes.outputs.matrix }}
      checks_ok: ${{ steps.checks.outputs.ok }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Merge base
        id: base
        run: echo "sha=$(git merge-base "origin/${{ github.base_ref }}" HEAD)" >> "$GITHUB_OUTPUT"
      # Checking team membership needs a GitHub App token (PLATFORM_APP_TOKEN).
      - name: Platform approval
        id: approval
        env:
          GH_TOKEN: ${{ secrets.PLATFORM_APP_TOKEN || github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          approved=false
          for user in $(gh api "repos/${{ github.repository }}/pulls/$PR/reviews" --jq '[.[] | select(.state=="APPROVED") | .user.login] | unique[]'); do
            if gh api "orgs/${{ github.repository_owner }}/teams/platform/memberships/$user" --jq .state 2>/dev/null | grep -q active; then approved=true; fi
          done
          echo "approved=$approved" >> "$GITHUB_OUTPUT"
      - name: PR rules
        id: checks
        env:
          PLATFORM_APPROVED: ${{ steps.approval.outputs.approved }}
        run: |
          if scripts/ci/check.sh "${{ steps.base.outputs.sha }}" HEAD | tee findings.txt; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: findings
          path: findings.txt
      - name: Affected stacks
        id: changes
        run: echo "matrix=$(scripts/ci/changes.sh "${{ steps.base.outputs.sha }}" HEAD)" >> "$GITHUB_OUTPUT"

  plan:
    needs: detect
    if: needs.detect.outputs.checks_ok == 'true' && vars.AWS_ACCOUNT_DEV != '' && fromJSON(needs.detect.outputs.matrix).include[0] != null
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # AWS login through OIDC, no stored keys
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    env:
      ACCOUNT: ${{ vars[format('AWS_ACCOUNT_{0}', matrix.env)] }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ env.ACCOUNT }}:role/gha-plan-${{ matrix.env }}
          aws-region: eu-central-1
      - name: Plan ${{ matrix.env }} (${{ matrix.count }} stack(s))
        env:
          EXECUTOR_ROLE_ARN: arn:aws:iam::${{ env.ACCOUNT }}:role/tofu-plan-${{ matrix.env }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: scripts/ci/run-stacks.sh plan "${{ matrix.env }}" "${{ matrix.stacks }}"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plan-${{ matrix.id }}
          path: |
            .out/*/*/plan.json
            .out/*/*/retain.txt
            .out/*/*/error.txt
          if-no-files-found: ignore

  report:
    needs: [detect, plan]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # can comment, but has no AWS access
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: results
          merge-multiple: true
      - name: Sticky PR comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          PLANS_SKIPPED: ${{ vars.AWS_ACCOUNT_DEV == '' && needs.detect.outputs.checks_ok == 'true' }}
        run: |
          grep '^✗' results/findings.txt > findings.txt || true
          scripts/ci/summarize.sh results findings.txt > comment.md
          if [[ $PLANS_SKIPPED == true ]]; then
            printf '\n> Plans skipped: no AWS account is configured for this repository.\n' >> comment.md
          fi
          cat comment.md >> "$GITHUB_STEP_SUMMARY"
          id=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --paginate \
                 --jq '[.[] | select(.body | startswith("<!-- platform-plan -->"))][0].id // empty')
          if [[ -n $id ]]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$id" -F body=@comment.md >/dev/null
          else
            gh pr comment "$PR" --body-file comment.md
          fi
      - name: Required status
        if: needs.detect.result != 'success' || needs.detect.outputs.checks_ok != 'true' || needs.plan.result == 'failure'
        run: echo "PR rules or plans failed; see the PR comment." && exit 1
