name: Platform toolchain
description: Pinned tools from mise.toml (tofu, conftest, aws-cli, yq, jsonschema, actionlint) and a provider cache.
runs:
  using: composite
  steps:
    - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
      with:
        install: true
        cache: true
    # Download the AWS provider once per job.
    - shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/tf-plugin-cache"
        echo "TF_PLUGIN_CACHE_DIR=$RUNNER_TEMP/tf-plugin-cache" >> "$GITHUB_ENV"
